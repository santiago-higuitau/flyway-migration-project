# Flyway Validation | applies info and validation before migrations to Neon `main`.
# Required secret: NEON_MAIN_DATABASE_URL (postgresql://user:pass@host/db?sslmode=require)

name: Flyway validation pre-migration

on:
  pull_request:
    branches:
      - main
    paths:
      - 'sql_migrations/**'
      - '.github/workflows/flyway-pr-check.yml'

  workflow_dispatch:

concurrency:
  group: flyway-pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FLYWAY_IMAGE: flyway/flyway:13.1.0-alpine
  MIGRATIONS_DIR: sql_migrations

jobs:
  info_and_validation:
    name: Info and validation to Neon (main)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Neon gives a URI (postgresql://user:pass@host/db); Flyway/JDBC needs
      # url + user + password separately, without channel_binding.
      - name: Translate Neon URI to JDBC params
        id: conn
        env:
          NEON_URI: ${{ secrets.NEON_MAIN_DATABASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${NEON_URI:-}" ]; then
            echo "::error::NEON_MAIN_DATABASE_URL secret is not set."
            exit 1
          fi

          no_proto="${NEON_URI#*://}"
          creds="${no_proto%%@*}"
          server="${no_proto#*@}"

          user="${creds%%:*}"
          pass="${creds#*:}"

          host_db="${server%%\?*}"
          host="${host_db%%/*}"
          db="${host_db#*/}"

          jdbc="jdbc:postgresql://${host}/${db}?sslmode=require"

          echo "::add-mask::${pass}"
          echo "jdbc=${jdbc}" >> "$GITHUB_OUTPUT"
          echo "user=${user}" >> "$GITHUB_OUTPUT"
          echo "pass=${pass}" >> "$GITHUB_OUTPUT"
          echo "Target: ${host}/${db}"

      - name: Pull Flyway image
        run: docker pull "${FLYWAY_IMAGE}"

      - name: Flyway info (before)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/${MIGRATIONS_DIR}:/flyway/sql:ro" \
            "${FLYWAY_IMAGE}" \
            -url="${{ steps.conn.outputs.jdbc }}" \
            -user="${{ steps.conn.outputs.user }}" \
            -password="${{ steps.conn.outputs.pass }}" \
            -locations="filesystem:/flyway/sql" \
            info

      # Catches checksum mismatches before touching the database.
      - name: Flyway validate
        id: flyway_validation
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/${MIGRATIONS_DIR}:/flyway/sql:ro" \
            "${FLYWAY_IMAGE}" \
            -url="${{ steps.conn.outputs.jdbc }}" \
            -user="${{ steps.conn.outputs.user }}" \
            -password="${{ steps.conn.outputs.pass }}" \
            -locations="filesystem:/flyway/sql" \
            -validateMigrationNaming=true \
            -ignoreMigrationPatterns='*:pending' \
            validate

      # Summary Step
      - name: Run Summary
        if: always()
        run: |
          {
            echo "## Flyway PR check | result"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| PR | #${{ github.event.pull_request.number }} |"
            echo "| Target | Neon · branch \`main\` |"
            echo "| Image | \`${FLYWAY_IMAGE}\` |"
            echo "| Migrations | \`${MIGRATIONS_DIR}\` |"
            echo "| Checksum drift | \`${{ steps.flyway_validation.outcome == 'success' && 'no detectado' || 'POSIBLE -> revisar log de validate' }}\` |"
            echo "| Status del job | \`${{ job.status }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"