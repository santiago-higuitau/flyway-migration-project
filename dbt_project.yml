name: "library_project"
version: "1.0.0"
config-version: 2

# Debe coincidir con la clave de nivel superior en profiles.yml.
profile: "library_project"

model-paths: ["dbt/models"]
test-paths: ["dbt/tests"]
macro-paths: ["dbt/macros"]
seed-paths: ["dbt/seeds"]
snapshot-paths: ["dbt/snapshots"]

# (ConfigTargetPathDeprecation). Se define como variable de entorno DBT_TARGET_PATH
# en .env, o con el flag --target-path en cada comando.
clean-targets:
  - "dbt/target"
  - "dbt/dbt_packages"


models:
  library_project:
    staging:
      # Silver: cast y rename únicamente, sin joins ni agregaciones.
      +materialized: view
      +schema: staging
    core:
      # Gold: joins y agregaciones, persistidos para no repetir el costo en
      # cada consulta de un dashboard o de un analista.
      +materialized: table
      +schema: core
